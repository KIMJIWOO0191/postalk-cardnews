<script>
const D = __DATA__;
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
for (const [k, v] of Object.entries(D.vars || {})) document.documentElement.style.setProperty('--' + k, v);
document.querySelectorAll('[data-photo]').forEach(i => { i.src = D.photos[i.dataset.photo]; });
document.querySelectorAll('[data-t]').forEach(e => { const t = get(D.copy, e.dataset.t); e.innerHTML = t == null ? '' : esc(t).split('\n').join('<br>'); });
document.querySelectorAll('[data-tags]').forEach(e => { const t = get(D.copy, e.dataset.tags) || ''; e.innerHTML = t.split('\n').filter(x => x.trim()).slice(0, 6).map(x => '<span class="x1-tag">' + esc(x.trim()) + '</span>').join(''); });
document.querySelectorAll('[data-snowtree]').forEach(g => {   // 눈가루 트리: 점을 삼각형 안에 흩뿌림 (고정 시드)
  const [cx, top, half, base] = g.dataset.snowtree.split(',').map(Number); let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; let h = '';
  for (let i = 0; i < 1500; i++) { const y = top + (base - top) * Math.pow(r(), .8), w = (y - top) / (base - top) * half, x = cx + (r() * 2 - 1) * w * (0.35 + 0.65 * r());
    const o = (0.25 + 0.75 * r() * (1 - Math.abs(x - cx) / (w + 1) * .6)).toFixed(2); h += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="' + (1 + r() * 3.2).toFixed(1) + '" ry="' + (1 + r() * 1.6).toFixed(1) + '" fill="#fff" opacity="' + o + '" transform="rotate(' + (r() * 180 | 0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + ')"/>'; }
  g.innerHTML = h; });
function fit() {   // 글자가 길면 줄여서 칸 안에 맞춤
  document.querySelectorAll('[data-fit]').forEach(e => {
    const max = +e.dataset.fit; let fs = parseFloat(getComputedStyle(e).fontSize), g = 0;
    e.style.whiteSpace = 'nowrap';
    const w = () => { const r = document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect().width; };
    while (w() > max && fs > 18 && g++ < 70) { fs -= 2; e.style.fontSize = fs + 'px'; }
  });
}
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => { fit(); document.body.dataset.ready = '1'; });
</script>
