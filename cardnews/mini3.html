<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'NotoKR'; src: url('fonts/NotoSansKR.ttf'); font-weight: 100 900; }
@font-face { font-family: 'Playfair'; src: url('fonts/PlayfairDisplay.ttf'); font-weight: 400 900; }
@font-face { font-family: 'Inter'; src: url('fonts/Inter.ttf'); font-weight: 100 900; }
@font-face { font-family: 'GamjaFlower'; src: url('fonts/GamjaFlower-Regular.ttf'); }
@font-face { font-family: 'Gaegu'; src: url('fonts/Gaegu-Regular.ttf'); }
@font-face { font-family: 'NanumPen'; src: url('fonts/NanumPenScript-Regular.ttf'); }
@font-face { font-family: 'HiMelody'; src: url('fonts/HiMelody-Regular.ttf'); }
@font-face { font-family: 'SingleDay'; src: url('fonts/SingleDay-Regular.ttf'); }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #444; }
.card { position: relative; width: 1080px; height: 1350px; overflow: hidden; margin-bottom: 20px; color: #fff; font-family: 'NotoKR', sans-serif; background: #222; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sh { text-shadow: 0 2px 14px rgba(0,0,0,.45); }
.abs { position: absolute; } .ctr { position: absolute; left: 0; width: 1080px; text-align: center; }
.scrim-t { position: absolute; left: 0; top: 0; width: 100%; height: 520px; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0)); }
.scrim-b { position: absolute; left: 0; bottom: 0; width: 100%; height: 520px; background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0)); }
.hand { font-family: var(--hand); font-weight: 400; letter-spacing: .02em; }
/* T1 심플 */
.t1-en { font: 600 30px/1.2 'Inter', 'NotoKR'; } .t1-ti { font: 700 66px/1.18 'NotoKR'; letter-spacing: -.02em; }
.t1-tag { font: 500 19px/1.55 'Inter', 'NotoKR'; letter-spacing: .08em; } .t1-big { font: 400 78px/1.1 'Playfair', serif; letter-spacing: .06em; text-transform: uppercase; }
.t1-h { font: 700 40px/1.3 'NotoKR'; } .t1-d { font: 400 36px/1.55 'NotoKR'; }
.white { background: #fff; color: #111; }
.ph { position: absolute; overflow: hidden; background: #ddd; } .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cap1 { position: absolute; font: 500 33px/1.5 'NotoKR'; color: #111; letter-spacing: -.01em; }
.num { display: inline-block; width: 42px; height: 42px; line-height: 42px; border-radius: 50%; font-size: 26px; margin-right: 12px; vertical-align: 2px; text-align: center; }
/* T2 귀여움 */
.bubble { position: absolute; background: #fff; color: #111; border-radius: 52px; padding: 30px 44px; font: 800 44px/1.35 'NotoKR'; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.bubble::after { content: ''; position: absolute; left: 60px; bottom: -34px; width: 56px; height: 56px; background: #fff; border-radius: 0 0 0 60px; transform: skewX(-24deg); }
.doodle { position: absolute; font-family: var(--hand); font-size: 46px; line-height: 1.25; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.frame { position: absolute; inset: 30px; border: 7px solid #fff; border-radius: 40px; }
.tape { position: absolute; width: 150px; height: 44px; background: rgba(255,230,160,.78); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.pol { position: absolute; background: #fff; padding: 20px 20px 74px; box-shadow: 0 8px 22px rgba(0,0,0,.2); }
.pol img { width: 100%; height: 440px; object-fit: cover; display: block; }
.pol span { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font: 400 40px/1 var(--hand); color: #6b4a3a; }
/* T3 핫플 */
.label { position: absolute; background: var(--label); color: #fff; padding: 22px 44px; border-radius: 16px; font: 600 38px/1.2 'NotoKR'; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.lines { position: absolute; font-family: var(--hand); text-shadow: 0 2px 10px rgba(0,0,0,.5); color: #fff; }
.inset { position: absolute; border: 8px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
.stamp { position: absolute; width: 130px; height: 130px; border: 4px solid #fff; border-radius: 50%; text-align: center; padding-top: 36px; font: 800 26px/1.15 'Inter', 'NotoKR', sans-serif; letter-spacing: .08em; transform: rotate(-10deg); }
/* T4 에디토리얼 */
:root { --t4bg: #E6E6E6; --t4bg2: #D9D9D9; --t4dark: #3A2418; }
.t4-t { position: absolute; font: 800 128px/.98 'Inter', 'NotoKR', sans-serif; letter-spacing: -.045em; color: #111; }
.t4-h { position: absolute; font: 700 34px/1.2 'Inter', 'NotoKR', sans-serif; color: #111; } .t4-li { position: absolute; font: 400 31px/1.5 'Inter', 'NotoKR', sans-serif; color: #222; }
.t4-i { position: absolute; font-family: 'Playfair', 'NotoSerifKR', 'Noto Serif CJK KR', serif; font-weight: 500; color: #F4E6D4; line-height: 1.02; }
</style></head><body>

<script>
const D = __DATA__;
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
for (const [k, v] of Object.entries(D.vars || {})) document.documentElement.style.setProperty('--' + k, v);
document.querySelectorAll('[data-photo]').forEach(i => { i.src = D.photos[i.dataset.photo]; });
document.querySelectorAll('[data-t]').forEach(e => { const t = get(D.copy, e.dataset.t); e.innerHTML = t == null ? '' : esc(t).split('\n').join('<br>'); });
function fit() {   // 글자가 길면 줄여서 칸 안에 맞춤
  document.querySelectorAll('[data-fit]').forEach(e => {
    const max = +e.dataset.fit; let fs = parseFloat(getComputedStyle(e).fontSize), g = 0;
    e.style.whiteSpace = 'nowrap';
    const w = () => { const r = document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect().width; };
    while (w() > max && fs > 20 && g++ < 60) { fs -= 2; e.style.fontSize = fs + 'px'; }
  });
}
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => { fit(); document.body.dataset.ready = '1'; });
</script>
